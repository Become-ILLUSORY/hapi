name: Android Fork Release

on:
    workflow_dispatch:
        inputs:
            version_code:
                description: 'Android versionCode (positive integer)'
                required: false
                type: string
                default: '1'
            version_name:
                description: 'versionName, e.g. 0.30.7'
                required: false
                type: string
                default: '0.30.7'

permissions:
    contents: read

concurrency:
    group: android-fork-release
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: android
        env:
            HAPI_VERSION_CODE: ${{ inputs.version_code }}
            HAPI_VERSION_NAME: ${{ inputs.version_name }}
            HAPI_UPLOAD_KEYSTORE: ${{ github.workspace }}/signing/hapi-upload.p12
            HAPI_UPLOAD_KEYSTORE_PASSWORD: hapi-upload-2026
            HAPI_UPLOAD_KEY_ALIAS: upload
            HAPI_UPLOAD_KEY_PASSWORD: hapi-upload-2026
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
            # setup-gradle restores/saves ~/.gradle (wrapper, dependency caches,
            # build-cache-1). cache-read-only:false keeps it writable on every
            # branch; cleanup prunes unused entries so the cache stays under the
            # 10 GB repo limit.
            - uses: gradle/actions/setup-gradle@v4
              with:
                  cache-read-only: false
                  gradle-home-cache-cleanup: true
            - name: Unit tests
              run: ./gradlew :core:protocol:test :core:data:testDebugUnitTest :app:testDebugUnitTest
            - name: Assemble signed release APK
              run: |
                  ./gradlew \
                      -PhapiVersionCode="$HAPI_VERSION_CODE" \
                      -PhapiVersionName="$HAPI_VERSION_NAME" \
                      :app:assembleRelease
            - name: Verify signature
              run: |
                  ls -l app/build/outputs/apk/release/
                  APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner | sort -V | tail -1)
                  "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk
            - uses: actions/upload-artifact@v4
              with:
                  name: hapi-android-release-${{ inputs.version_code }}
                  if-no-files-found: error
                  path: android/app/build/outputs/apk/release/*.apk
